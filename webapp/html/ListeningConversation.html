<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngStudy - Listening Conversation</title>
    <link rel="stylesheet" href="../css/Listening.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <!-- Conversation-specific styles -->
    <link rel="stylesheet" href="../css/ListeningConversation.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="sub-header">
                <div class="name-centre"><h1>EngStudy</h1></div>
                <div class="tbi-header-right">
                    <div class="clock" id="clock">00:00:00</div>
                    <div class="avatar-wrapper"><div class="avatar"></div></div>
                    <div class="icon">
                        <i id="extension-icon" class="fa-solid fa-ellipsis"></i>
                        <ul class="list">
                            <li><a href="">Profile</a></li>
                            <li><a href="">Change Information</a></li>
                            <li><a href="">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="container-content">
            <div class="top-bar">
                <div class="name-feature">Listening Conversation</div>

                <div class="sentence-bar">
                    <div class="list-vocabulary">
                        <button class="icon-left"><i class="fa-solid fa-arrow-left"></i></button>
                        <!-- Pagination numbers sẽ được JS thêm -->
                        <button class="icon-right"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <!-- LEFT -->
                <div class="left">
                    <!-- Audio hội thoại -->
                    <audio class="audio conversation-audio" controls></audio>

                    <div id="question-title" 
                        style="text-align:center;margin:18px 0;font-size:20px;font-weight:600;color:#1b3a57;font-family:Poppins, sans-serif;">
                    </div>

                    <!-- Các lựa chọn -->
                    <div class="answers">
                        <button data-choice="A"><div class="index"><p>A</p></div><p class="text"></p></button>
                        <button data-choice="B"><div class="index"><p>B</p></div><p class="text"></p></button>
                        <button data-choice="C"><div class="index"><p>C</p></div><p class="text"></p></button>
                        <button data-choice="D"><div class="index"><p>D</p></div><p class="text"></p></button>
                    </div>

                    <div class="submit-section" style="margin-top: 30px; text-align: center;">
                        <button id="submit-btn" class="submit-btn">
                            <i class="fa-solid fa-paper-plane"></i> NỘP BÀI
                        </button>
                        <p class="submit-note" style="margin-top: 12px; font-size: 14px; color: #7f8c8d;">
                            Bạn đã trả lời <span id="answered-count">0</span>/10 câu
                        </p>
                    </div>
                </div>

                <!-- RIGHT -->
                <div class="right">
                    <div class="transcript-header">
                        <h2 class="transcript-title">Illustration</h2>
                    </div>
                    <div class="transcript-content">
                        <p style="text-align:center;color:#888;margin-top:40px;">Loading script...</p>
                    </div>
                </div>
            </div>
                <div class="tbi-practice-info">
                    <div class="tbi-info-icon"><i class="fa-solid fa-circle-info"></i></div>
                    <div class="tbi-info-text">
                        <strong>Mỗi lần luyện tập gồm 5 hội thoại, mỗi đoạn có 2 câu hỏi</strong> được chọn ngẫu nhiên.
                    </div>
                </div>
            <div class="tbi-footer-bottom">
                <p>&copy; 2025 EngStudy. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="../js/clock.js"></script>
    <script src="../js/avatar.js"></script>
    <script src="../js/dropdown.js"></script>

    <!-- JS mới -->
    <script src="../js/listening-conversation.js"></script>
</body>
</html>
