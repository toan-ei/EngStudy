<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Quản lý Câu hỏi Nghe | EngStudy</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/AdminListeningQuestions.css">
  <link rel="stylesheet" href="../css/AdminLayout.css">
</head>
<body>

  <div class="admin-container">

    <div class="admin-card">
      <div class="admin-actions">
        <div class="filter-group">
          <label>Lọc theo bài tập:</label>
          <select id="filter-exercise">
            <option value="">Tất cả bài tập</option>
            <!-- JS sẽ đổ danh sách -->
          </select>
        </div>

        <button class="btn btn-primary" id="open-modal">
          <i class="fas fa-plus"></i> Thêm câu hỏi mới
        </button>
      </div>

      <div class="table-wrapper">
        <table id="questions-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Câu hỏi</th>
              <th>Bài tập</th>
              <th>File ID</th>
              <th>Đáp án đúng</th>
              <th>Điểm</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS đổ dữ liệu -->
          </tbody>
        </table>
          <div class="pagination">
            <button id="prev-page" class="btn">← Trước</button>
            <span id="page-info"></span>
            <button id="next-page" class="btn">Tiếp →</button>
          </div>
      </div>
    </div>
  </div>

  <!-- Modal Thêm / Sửa Câu hỏi -->
  <div class="modal" id="question-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Thêm câu hỏi mới</h2>
        <button class="close-modal">x</button>
      </div>

      <form id="question-form">
        <input type="hidden" id="question-id" />

        <div class="form-group">
          <label for="exercise-id">Bài tập nghe *</label>
          <select id="exercise-id" required>
            <option value="">-- Chọn bài tập --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="question-text">Nội dung câu hỏi *</label>
          <textarea id="question-text" rows="3" required placeholder="What does the woman usually do on weekends?"></textarea>
        </div>

        <div class="options-grid">
          <div class="form-group">
            <label><span class="option-label">A</span> Đáp án A *</label>
            <input type="text" id="optionA" required />
          </div>
          <div class="form-group">
            <label><span class="option-label">B</span> Đáp án B *</label>
            <input type="text" id="optionB" required />
          </div>
          <div class="form-group">
            <label><span class="option-label">C</span> Đáp án C *</label>
            <input type="text" id="optionC" required />
          </div>
          <div class="form-group">
            <label><span class="option-label">D</span> Đáp án D *</label>
            <input type="text" id="optionD" required />
          </div>
        </div>

        <div class="form-group">
          <label>Đáp án đúng *</label>
          <div class="correct-options">
            <label><input type="radio" name="correct" value="A" required> A</label>
            <label><input type="radio" name="correct" value="B"> B</label>
            <label><input type="radio" name="correct" value="C"> C</label>
            <label><input type="radio" name="correct" value="D"> D</label>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="file-id">File ID *</label>
            <input type="number" id="file-id" required placeholder="Nhập ID file âm thanh"/>
          </div>
          <div class="form-group">
            <label for="description">Mô tả câu hỏi *</label>
            <input type="text" id="description" required placeholder="Nhập mô tả câu hỏi của bạn"/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="score">Điểm (mặc định: 1)</label>
            <input type="number" id="score" min="0" value="1" placeholder="1" />
          </div>
          <div class="form-group">
            <label for="order-index">Thứ tự hiển thị</label>
            <input type="number" id="order-index" min="0" placeholder="0" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> <span id="submit-text">Thêm câu hỏi</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/admin-questions.js"></script>
  <script src="../js/admin-header.js"></script>
</body>
</html>
