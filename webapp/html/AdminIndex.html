<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard | EngStudy</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">

  <!-- ĐÚNG ĐƯỜNG DẪN CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/itsalexnguyen/admin-theme@latest/AdminLayout.css">
  <link rel="stylesheet" href="/css/AdminLayout.css"> 
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 24px; margin-bottom: 40px; }
    .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 20px; padding: 28px; border: 1px solid var(--border); text-align: center; transition: all .3s; }
    .stat-card:hover { transform: translateY(-10px); box-shadow: 0 20px 50px rgba(139,92,246,.3); }
    .stat-icon { font-size: 3rem; margin-bottom: 16px; background: linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-number { font-size: 2.6rem; font-weight: 900; margin: 8px 0; }
    .stat-label { color: var(--text-muted); font-size: 1.1rem; }
    .recent-activity { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 20px; padding: 32px; border: 1px solid var(--border); }
    .activity-header h3 { font-size: 1.6rem; background: linear-gradient(90deg,#c4b5fd,white); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <!-- Sidebar sẽ được JS chèn vào đây -->
  <main class="main-content">
    <div class="admin-container">
      <div class="admin-header">
        <h1>EngStudy Admin</h1>
        <p>Chào mừng quay lại! Đây là tổng quan hệ thống hôm nay</p>
      </div>

      <!-- Stats Cards + Recent Activity giữ nguyên như bạn đã code -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-headphones"></i></div>
          <div class="stat-number">48</div>
          <div class="stat-label">Bài tập nghe</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-question-circle"></i></div>
          <div class="stat-number">892</div>
          <div class="stat-label">Câu hỏi</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-file-audio"></i></div>
          <div class="stat-number">156</div>
          <div class="stat-label">File âm thanh</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-th-large"></i></div>
          <div class="stat-number">12</div>
          <div class="stat-label">Chủ đề</div>
        </div>
      </div>

    </div>
  </main>

  <!-- JS đúng đường dẫn -->
  <script src="/js/admin-layout.js"></script>
</body>
</html>
