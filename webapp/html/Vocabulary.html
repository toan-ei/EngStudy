<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngStudy</title>
    <link rel="stylesheet" href="../css/Vocabulary.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="sub-header">
                <div class="name-centre">
                    <h1>EngStudy</h1>
                </div>
                <div class="container-item">
                    <div class="clock"></div>
                    <div class="avatar"></div>
                    <div class="icon">
                        <i id="extension-icon" class="fa-solid fa-ellipsis"></i>
                        <ul class="list">
                            <li><a href="">Profile</a></li>
                            <li><a href="">Change Information</a></li>
                            <li><a href="">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-content">
            <div class="top-bar">
                <div class="name-feature">Vocabulary</div>
                <div class="sentence-bar">
                    <div class="list-vocabulary">
                        <button class="icon-left"><i class="fa-solid fa-arrow-left"></i></button>
                        <!-- Các số sẽ được JS tự động thêm vào đây -->
                        <button class="icon-right"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="vocabulary">
                    <div class="word"><p data-index="0">HELLO</p></div>
                    <input type="text" placeholder="Nhập từ bạn nghĩ là đúng...">
                    <div class="control">
                        <button class="prev-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <button class="next-btn"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
                <div class="suggest">
                    <div class="container-suggest">
                        <div class="name"><h2>SUGGEST</h2></div>
                        <div class="help-me"><button>Help Me</button></div>
                    </div>
                    <div class="frame-answer">
                        <p>Gợi ý ngữ cảnh để bạn tự nhận biết được nghĩa từ vựng. không gợi ý từ khóa chính xác!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="../js/Vocabulary.js"></script>
    
    <script src="../js/clock.js"></script>
</body>
</html>
