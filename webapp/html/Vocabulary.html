<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Boy IELTS</title>
    <link rel="stylesheet" href="../css/Vocabulary.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="sub-header">
                <div class="name-centre">
                    <H1>The Boy IELTS</H1>
                </div>
                <div class="container-item">
                    <div class="clock">

                    </div>
                    <div class="avatar">
                        
                    </div>
                    <div class="icon">
                        <i id="extension-icon" class="fa-solid fa-ellipsis"></i>
                        <ul class="list">
                            <li><a href="">profile</a></li>
                            <li><a href="">Change information</a></li>
                            <li><a href="">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-content">
            <div class="sub-content">
                <div class="name-feature">Vocabulary</div>
                <div class="list-vocabulary">
                    <button class="icon-left">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                    <button>11</button>
                    <button class="icon-right">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
            <div class="main-content">
                <div class="vocabulary">
                    <div class="word">
                        <p>hello</p>
                    </div>
                    <input type="text">
                    <div class="control">
                        <button>
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <button>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
                <div class="suggest">
                    <div class="container-suggest">
                        <div class="name">
                            <h2>SUGGEST</h2>
                        </div>
                        <div class="help-me">
                            <button>Help Me</button>
                        </div>
                    </div>
                    <div class="frame-answer">
                        <p>Gợi ý ngữ cảnh để bạn tự nhận biết được nghĩa từ vựng. không gợi ý từ khóa chính xác!</p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
